# Render Blueprint — Free tier deployment
# Docs: https://render.com/docs/blueprint-spec
# Usage: Connect repo to Render → New Blueprint → select this file

services:
  # ─── Frontend (Next.js) ──────────────────────────
  - type: web
    name: hireright-frontend
    runtime: node
    plan: free
    buildCommand: npm install && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma db push --skip-generate && npm run build
    startCommand: next start -p $PORT
    nodeVersion: "22"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    autoDeploy: true

  # ─── Backend (FastAPI) ───────────────────────────
  - type: web
    name: hireright-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    autoDeploy: true

  # ─── Agent (Python) ──────────────────────────────
  - type: web
    name: hireright-agent
    runtime: docker
    dockerfilePath: Dockerfile.agent
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      - key: BACKEND_URL
        fromService:
          name: hireright-backend
          type: web
          property: host
    autoDeploy: true

  # ─── Code Evaluator ─────────────────────────────
  - type: web
    name: hireright-evaluator
    runtime: docker
    dockerfilePath: evaluator/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true

  # ─── ML Prediction Server ───────────────────────
  - type: web
    name: hireright-ml
    runtime: docker
    dockerfilePath: Dockerfile.ml
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true
