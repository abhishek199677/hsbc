<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireRight - Offline</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; color: #374151; }
    .container { text-align: center; padding: 2rem; }
    h1 { color: #4f46e5; font-size: 1.5rem; }
    p { color: #6b7280; }
    button { margin-top: 1rem; padding: 0.5rem 1.5rem; background: #4f46e5; color: #fff; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 1rem; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
